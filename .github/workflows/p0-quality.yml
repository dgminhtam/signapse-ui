name: P0 quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run P0 quality aggregate
        run: pnpm test:quality

      - name: Upload P0 failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-quality-evidence
          if-no-files-found: ignore
          path: |
            test-results/
            coverage/
